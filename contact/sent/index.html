<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Titans of Progress — Sent</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#2e2b27">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:wght@400;700&family=Inter:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --edge: #100e0c; --case: #2e2b27; --case-lit: #383430;
    --ink: #eee6d2; --gold: #c9a869; --gold-hi: #f0dcae;
    --serif: "Libre Caslon Text", Georgia, serif; --sans: Inter, system-ui, sans-serif; --mono: "IBM Plex Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html { background: var(--edge); }
  body { margin: 0; color: var(--ink); font-family: var(--sans); font-size: 17px; line-height: 1.6; min-height: 100vh;
    background: radial-gradient(ellipse at top, var(--case-lit) 0%, var(--case) 40%, var(--edge) 100%) fixed; }
  a { color: var(--gold-hi); }
  .wrap { max-width: 960px; margin: 0 auto; padding: 96px 20px; text-align: center; }
  .kicker { font-family: var(--mono); font-size: 13px; letter-spacing: .3em; text-transform: uppercase; color: var(--gold); }
  h1 { font-family: var(--serif); color: var(--gold-hi); font-size: clamp(36px, 6vw, 60px); line-height: 1.1; margin: 8px 0 18px; }
  p { font-family: var(--serif); font-size: 20px; margin: 0 0 28px; }
</style>
</head>
<body>
<main class="wrap">
  <div class="kicker">Contact</div>
  <h1>Your letter is sent</h1>
  <p>Thank you. It will be read, and answered if it asks for an answer.</p>
  <a href="/">Back to Titans of Progress</a>
</main>
</body>
</html>
